name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Publishes a tag that already exists, such as one created before this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v2.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG_NAME#v}"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Git tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      # npm publish automatically runs the package's prepublishOnly lifecycle:
      # type-checks the source, runs the tests, and builds dist/.
      - name: Publish to npm
        run: npm publish --access public
